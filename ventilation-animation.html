<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventilation Animation</title>
    <style>
        :root {
            --bg: transparent;
            --fg: #E5E5E5;
            --fg-secondary: #A3A3A3;
            --fg-muted: #555555;
            --accent: #4CAF50;
            --danger: #f44336;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: transparent; 
            font-family: 'SF Mono', 'Courier New', monospace; 
            color: var(--fg);
        }
        
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            outline: none;
        }

        /* === МИНИМАЛИСТИЧНАЯ ПАНЕЛЬ === */
        #control-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .panel-row {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(13, 13, 13, 0.6);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 4px;
            border-left: 2px solid var(--fg-muted);
            transition: border-color 0.3s;
        }

        .panel-row:hover {
            border-left-color: var(--fg);
        }

        .label {
            font-size: 9px;
            color: var(--fg-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 60px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 120px;
            height: 2px;
            background: var(--fg-muted);
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: var(--fg);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .switch-group {
            display: flex;
            gap: 5px;
        }
        
        .switch-btn {
            background: transparent;
            border: 1px solid var(--fg-muted);
            color: var(--fg-muted);
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 9px;
            text-transform: uppercase;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .switch-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(76, 175, 80, 0.1);
        }

        .switch-btn.closed {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(244, 67, 54, 0.1);
        }

        .stats {
            font-size: 10px;
            color: var(--fg);
            font-family: monospace;
            display: flex;
            gap: 15px;
        }
        .stat-item span { color: var(--fg-muted); margin-right: 5px; }

        .label-container {
            position: absolute;
            color: var(--fg);
            font-size: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .label-title { font-weight: bold; }
        .label-sub { font-size: 8px; color: var(--fg-secondary); display: block; margin-top: 2px;}

        #svg-lines {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <svg id="svg-lines"></svg>
        
        <div id="control-panel">
            <div class="panel-row">
                <span class="label">Intensity</span>
                <input type="range" min="0" max="100" value="60" id="fan-slider">
            </div>
            
            <div class="panel-row">
                <span class="label">Gate</span>
                <div class="switch-group">
                    <button id="btn-open" class="switch-btn active" onclick="setDamper(true)">Open</button>
                    <button id="btn-close" class="switch-btn" onclick="setDamper(false)">Shut</button>
                </div>
            </div>

            <div class="panel-row stats">
                <div class="stat-item"><span>FLOW</span><b id="flow-rate">850</b></div>
                <div class="stat-item"><span>PRES</span><b id="pressure-val">120</b></div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            scene: { bgColor: 0x0D0D0D, gridColor: 0x333333, gridOpacity: 0.2 },
            colors: { fill: 0x1A1A1A, line: 0xE5E5E5, lineMuted: 0x444444 },
            duct: { width: 1.5, height: 1.5, opacity: 0.15, mainLength: 8, verticalLength: 4, bendRadius: 1.5 },
            particles: { count: 3000 },
            components: { damperX: -3.5, fanX: 0, bendX: 3.5 }
        };

        const layers = [
            { color: 0xB0B0B0, size: 0.1, maxLife: 250, speed: 1.2, frequency: 2 },
            { color: 0xFFFFFF, size: 0.3, maxLife: 200, speed: 1.1, frequency: 3 },
            { color: 0xB0B0B0, size: 0.5, maxLife: 150, speed: 0.9, frequency: 4 }
        ];

        let scene, camera, renderer, controls;
        let fanRotor, damperBlades, particleSystem;
        const clock = new THREE.Clock();
        const annotationData = [];
        let frameCount = 0; 

        let systemState = { fanSpeed: 0.6, damperOpen: true };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-14, 6, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 2, 0);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            createEnvironment();
            createDuctSystem(); 
            createInternalComponents(); 
            createAnnotations();
            initParticleSystem();

            startSequence();
            animate();
            
            setupUI();
        }

        function createGhostMaterial(opacity = 0.05) {
            return new THREE.MeshBasicMaterial({
                color: CONFIG.colors.fill,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
        }

        function createTechEdges(geometry, color = CONFIG.colors.line) {
            const edges = new THREE.EdgesGeometry(geometry, 15);
            const lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
            return new THREE.LineSegments(edges, lineMat);
        }

        function createBlueprintPart(geometry, pos = {x:0,y:0,z:0}, opacity = 0.03) {
            const group = new THREE.Group();
            const faceMat = new THREE.MeshBasicMaterial({
                color: CONFIG.colors.fill,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(geometry, faceMat);
            group.add(mesh);
            const edges = createTechEdges(geometry);
            group.add(edges);
            group.position.set(pos.x, pos.y, pos.z);
            return group;
        }

        function createDuctSystem() {
            const mainGroup = new THREE.Group();
            const W = CONFIG.duct.width;
            const H = CONFIG.duct.height;
            const R = CONFIG.duct.bendRadius; 
            const op = CONFIG.duct.opacity;
            const horizLength = CONFIG.duct.mainLength;

            const horizGeo = new THREE.BoxGeometry(horizLength, H, W);
            const horizDuct = new THREE.Mesh(horizGeo, createGhostMaterial(op));
            horizDuct.position.set(-horizLength/2, H/2 + 0.5, 0); 
            mainGroup.add(horizDuct);
            const hEdges = createTechEdges(horizGeo).clone();
            hEdges.position.copy(horizDuct.position);
            mainGroup.add(hEdges);

            for(let i = -horizLength + 1; i < 0; i += 2) {
                const ringGeo = new THREE.BoxGeometry(0.1, H + 0.1, W + 0.1);
                const ring = createBlueprintPart(ringGeo, {x: i, y: H/2 + 0.5, z: 0});
                mainGroup.add(ring);
            }

            const shape = new THREE.Shape();
            shape.moveTo(-W/2, -H/2);
            shape.lineTo(W/2, -H/2);
            shape.lineTo(W/2, H/2);
            shape.lineTo(-W/2, H/2);
            shape.lineTo(-W/2, -H/2);

            const startY = H/2 + 0.5; 
            const P0 = new THREE.Vector3(0, startY, 0);
            const P1 = new THREE.Vector3(R, startY, 0);
            const P2 = new THREE.Vector3(R, startY + R, 0);
            
            const curve = new THREE.QuadraticBezierCurve3(P0, P1, P2);
            const extrudeSettings = { steps: 20, bevelEnabled: false, extrudePath: curve };
            const bendGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const bendMesh = new THREE.Mesh(bendGeo, createGhostMaterial(op));
            mainGroup.add(bendMesh);
            
            const edgesBend = new THREE.EdgesGeometry(bendGeo, 30); 
            const linesBend = new THREE.LineSegments(edgesBend, new THREE.LineBasicMaterial({ color: CONFIG.colors.line, transparent: true, opacity: 0.6 }));
            mainGroup.add(linesBend);

            const vertStartX = R;
            const vertStartY = startY + R;
            const vertLength = CONFIG.duct.verticalLength;
            
            const vertGeo = new THREE.BoxGeometry(W, vertLength, H);
            const vertDuct = new THREE.Mesh(vertGeo, createGhostMaterial(op));
            vertDuct.position.set(vertStartX, vertStartY + vertLength/2, 0);
            mainGroup.add(vertDuct);
            
            const vEdges = createTechEdges(vertGeo).clone();
            vEdges.position.copy(vertDuct.position);
            mainGroup.add(vEdges);

            for(let i = vertStartY + 1; i < vertStartY + vertLength; i += 2) {
                const ringGeo = new THREE.BoxGeometry(W + 0.1, 0.1, H + 0.1);
                const ring = createBlueprintPart(ringGeo, {x: vertStartX, y: i, z: 0});
                mainGroup.add(ring);
            }

            scene.add(mainGroup);
            
            window.ductBounds = {
                minX: -horizLength,
                maxX: 0,
                startY: startY,
                maxY: vertStartY + vertLength,
                curvePoints: { p0: P0, p1: P1, p2: P2 } 
            };
        }

        function createInternalComponents() {
            const W = CONFIG.duct.width;
            const H = CONFIG.duct.height;
            const Y = H/2 + 0.5;

            const damperGroup = new THREE.Group();
            damperGroup.position.set(CONFIG.components.damperX, Y, 0);
            const body = createBlueprintPart(new THREE.BoxGeometry(0.3, H + 0.1, W + 0.1));
            damperGroup.add(body);

            damperBlades = new THREE.Group();
            const bladeThickness = 0.04;
            const bladeWidth = W * 0.48; 
            const bladeGeo = new THREE.BoxGeometry(bladeThickness, H * 0.95, bladeWidth);
            
            const blade1G = new THREE.Group();
            const b1Mesh = new THREE.Mesh(bladeGeo, createGhostMaterial(0.6));
            const b1Edges = createTechEdges(bladeGeo);
            b1Mesh.position.z = W / 4; 
            b1Edges.position.z = W / 4; 
            blade1G.add(b1Mesh); blade1G.add(b1Edges);
            damperBlades.add(blade1G);

            const blade2G = new THREE.Group();
            const b2Mesh = new THREE.Mesh(bladeGeo, createGhostMaterial(0.6));
            const b2Edges = createTechEdges(bladeGeo);
            b2Mesh.position.z = -W / 4;
            b2Edges.position.z = -W / 4;
            blade2G.add(b2Mesh); blade2G.add(b2Edges);
            damperBlades.add(blade2G);

            const shaftGeo = new THREE.CylinderGeometry(0.05, 0.05, H * 0.95, 8);
            const shaftMesh = new THREE.Mesh(shaftGeo, createGhostMaterial(0.5));
            shaftMesh.rotation.x = Math.PI / 2;
            damperBlades.add(shaftMesh);
            damperBlades.add(createTechEdges(shaftGeo).clone().rotateX(Math.PI/2));
            
            damperGroup.add(damperBlades);
            scene.add(damperGroup);

            const fanGroup = new THREE.Group();
            fanGroup.position.set(CONFIG.components.fanX, Y, 0);
            const fanSectionGeo = new THREE.BoxGeometry(0.3, H, W);
            fanGroup.add(createBlueprintPart(fanSectionGeo));

            fanRotor = new THREE.Group();
            const hubRadius = 0.1;
            const hubLen = 0.1;
            const hubGeo = new THREE.CylinderGeometry(hubRadius, hubRadius, hubLen, 16);
            const hubMesh = new THREE.Mesh(hubGeo, createGhostMaterial(0.5));
            hubMesh.rotation.z = Math.PI / 2;
            fanRotor.add(hubMesh);
            fanRotor.add(createTechEdges(hubGeo).clone().rotateZ(Math.PI / 2));

            const bladeCount = 8;
            const rotorRadius = W/1.8 - 0.1;
            const bladeLength = rotorRadius - hubRadius;
            const bGeo = new THREE.BoxGeometry(0.02, bladeLength, 0.15);
            
            for(let i=0; i<bladeCount; i++) {
                const angle = (i/bladeCount) * Math.PI * 2;
                const bladePivot = new THREE.Group();
                const bMesh = new THREE.Mesh(bGeo, createGhostMaterial(0.5));
                const bEdges = createTechEdges(bGeo);
                bMesh.position.y = hubRadius + bladeLength/2;
                bEdges.position.y = hubRadius + bladeLength/2;
                bMesh.rotation.y = 0.8;
                bEdges.rotation.y = 0.7;
                bladePivot.add(bMesh); bladePivot.add(bEdges);
                bladePivot.rotation.x = angle;
                fanRotor.add(bladePivot);
            }

            const ringGeo = new THREE.TorusGeometry(rotorRadius, 0, 8, 32);
            const ringMesh = new THREE.Mesh(ringGeo, createGhostMaterial(0.4));
            ringMesh.rotation.y = Math.PI / 2;
            fanRotor.add(ringMesh);
            fanRotor.add(createTechEdges(ringGeo).clone().rotateY(Math.PI / 2));

            fanGroup.add(fanRotor);
            scene.add(fanGroup);

            window.sceneObjects = { damper: damperGroup, fan: fanGroup, rotor: fanRotor };
        }

        function createEnvironment() {
            const grid = new THREE.GridHelper(30, 60, CONFIG.scene.gridColor, CONFIG.scene.bgColor);
            grid.material.opacity = CONFIG.scene.gridOpacity;
            grid.material.transparent = true;
            scene.add(grid);
        }

        let particles = []; 
        
        function initParticleSystem() {
            const geometry = new THREE.BufferGeometry();
            const MAX_PARTICLES = CONFIG.particles.count; 
            const positions = new Float32Array(MAX_PARTICLES * 3);
            const alphas = new Float32Array(MAX_PARTICLES);
            const sizes = new Float32Array(MAX_PARTICLES);
            const colors = new Float32Array(MAX_PARTICLES * 3);

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.ShaderMaterial({
                uniforms: { pointTexture: { value: texture } },
                vertexShader: `
                    attribute float alpha;
                    attribute float size;
                    attribute vec3 color;
                    varying float vAlpha;
                    varying vec3 vColor;
                    void main() {
                        vAlpha = alpha; vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D pointTexture;
                    varying float vAlpha;
                    varying vec3 vColor;
                    void main() {
                        vec4 texColor = texture2D(pointTexture, gl_PointCoord);
                        gl_FragColor = vec4(vColor, vAlpha * texColor.a);
                    }
                `,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        class DuctParticle {
            constructor(x, y, z, colorHex, size, maxLife, layerSpeed) {
                this.pos = new THREE.Vector3(x, y, z);
                this.color = new THREE.Color(colorHex);
                this.size = size;
                this.maxLife = maxLife; 
                this.layerSpeed = layerSpeed;
                this.life = 0;
                this.alpha = 1.0;
                this.stage = 0; 
                this.vel = new THREE.Vector3();
                this.t = 0; 
                this.initialYoffset = 0; 
                this.setupVelocity();
            }

            setupVelocity() {
                const speedFactor = systemState.fanSpeed;
                const damperIsOpen = systemState.damperOpen;
                if (!damperIsOpen) {
                    this.vel.set((Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02);
                } else {
                    const baseSpeed = 0.05 * speedFactor * this.layerSpeed;
                    this.vel.set(baseSpeed, 0, 0);
                }
            }

            getBezierPoint(t, p0, p1, p2) {
                const cX = Math.pow(1-t, 2) * p0.x + 2 * (1-t) * t * p1.x + Math.pow(t, 2) * p2.x;
                const cY = Math.pow(1-t, 2) * p0.y + 2 * (1-t) * t * p1.y + Math.pow(t, 2) * p2.y;
                return {x: cX, y: cY};
            }
            
            getBezierNormal(t, p0, p1, p2) {
                const tx = 2 * (1-t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
                const ty = 2 * (1-t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
                const len = Math.sqrt(tx*tx + ty*ty);
                const txNorm = tx / len;
                const tyNorm = ty / len;
                return {x: -tyNorm, y: txNorm};
            }

            update() {
                const cfg = CONFIG;
                const bounds = window.ductBounds;
                const speedFactor = systemState.fanSpeed;
                const damperIsOpen = systemState.damperOpen;
                this.life++;

                const limitY = cfg.duct.height / 2 - 0.1;
                const limitZ = cfg.duct.width / 2 - 0.1;

                if (!damperIsOpen) {
                    this.vel.x += (Math.random() - 0.5) * 0.005;
                    this.vel.y += (Math.random() - 0.5) * 0.005;
                    this.vel.z += (Math.random() - 0.5) * 0.005;
                    this.vel.clampLength(0, 0.03);
                    this.pos.add(this.vel);

                    if (this.pos.x < bounds.minX + 0.5) { this.pos.x = bounds.minX + 0.5; this.vel.x *= -1; }
                    if (this.pos.x > cfg.components.damperX) { this.pos.x = cfg.components.damperX; this.vel.x *= -1; }

                    const currentOffsetY = this.pos.y - bounds.startY;
                    if (Math.abs(currentOffsetY) > limitY) { this.pos.y = bounds.startY + Math.sign(currentOffsetY) * limitY; this.vel.y *= -1; }
                    if (Math.abs(this.pos.z) > limitZ) { this.pos.z = Math.sign(this.pos.z) * limitZ; this.vel.z *= -1; }
                    this.alpha = 1.0;

                } else {
                    const visualSpeedMultiplier = 5; 

                    if (this.stage === 0) {
                        this.vel.y *= 0.9;
                        this.vel.z *= 0.9;
                        const targetVx = 0.05 * speedFactor * this.layerSpeed * visualSpeedMultiplier;
                        this.vel.x += (targetVx - this.vel.x) * 0.1;
                        this.pos.add(this.vel);
                        
                        if (this.pos.x > bounds.maxX) {
                            this.stage = 1;
                            this.t = 0; 
                            this.initialYoffset = THREE.MathUtils.clamp(this.pos.y - bounds.startY, -limitY, limitY);
                        }
                    } else if (this.stage === 1) {
                        const dt = (0.05 * speedFactor * this.layerSpeed * visualSpeedMultiplier * 0.15); 
                        this.t += dt;
                        const P = bounds.curvePoints;
                        
                        if (this.t >= 1.0) {
                            this.stage = 2;
                            this.t = 1.0; 
                            this.vel.y = 0.05 * speedFactor * this.layerSpeed * visualSpeedMultiplier;
                        }
                        
                        const center = this.getBezierPoint(this.t, P.p0, P.p1, P.p2);
                        const normal = this.getBezierNormal(this.t, P.p0, P.p1, P.p2);
                        
                        this.pos.x = center.x + this.initialYoffset * normal.x;
                        this.pos.y = center.y + this.initialYoffset * normal.y;

                    } else if (this.stage === 2) {
                        this.pos.y += this.vel.y;
                        if (this.pos.y > bounds.maxY - 3) { this.alpha -= 0.05; }
                    }
                }
            }

            isFinished() { return this.life > this.maxLife || this.alpha <= 0; }
        }

        function updateParticles() {
            const cfg = CONFIG;
            const bounds = window.ductBounds;
            const speedFactor = systemState.fanSpeed;
            const startY = cfg.duct.height/2 + 0.5; 

            if (speedFactor > 0.01) {
                layers.forEach(layer => {
                    if (frameCount % layer.frequency === 0) {
                        const x = bounds.minX + 0.5;
                        const y = startY + (Math.random() - 0.5) * (cfg.duct.height - 0.5);
                        const z = (Math.random() - 0.5) * (cfg.duct.width - 0.5);
                        particles.push(new DuctParticle(x, y, z, layer.color, layer.size, 600, layer.speed));
                    }
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].isFinished()) particles.splice(i, 1);
            }

            const positions = particleSystem.geometry.attributes.position.array;
            const alphas = particleSystem.geometry.attributes.alpha.array;
            const sizes = particleSystem.geometry.attributes.size.array;
            const colors = particleSystem.geometry.attributes.color.array;

            let idx = 0;
            const MAX_RENDER = CONFIG.particles.count; 
            
            for (let i = 0; i < particles.length; i++) {
                if (idx < MAX_RENDER) {
                    let p = particles[i];
                    positions[idx * 3] = p.pos.x;
                    positions[idx * 3 + 1] = p.pos.y;
                    positions[idx * 3 + 2] = p.pos.z;
                    alphas[idx] = Math.max(0, p.alpha);
                    sizes[idx] = p.size;
                    colors[idx * 3] = p.color.r;
                    colors[idx * 3 + 1] = p.color.g;
                    colors[idx * 3 + 2] = p.color.b;
                    idx++;
                }
            }
            for (let i = idx; i < MAX_RENDER; i++) alphas[i] = 0;
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.alpha.needsUpdate = true;
            particleSystem.geometry.attributes.size.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
        }

        function setDamper(isOpen) {
            systemState.damperOpen = isOpen;
            document.getElementById('btn-open').classList.toggle('active', isOpen);
            document.getElementById('btn-close').classList.toggle('closed', !isOpen);
            updateSystemUI();
        }

        function updateSystemUI() {
            const speed = systemState.fanSpeed;
            const isOpen = systemState.damperOpen;
            
            if (isOpen && speed > 0.05) {
                document.getElementById('flow-rate').innerText = Math.round(speed * 1400);
                document.getElementById('pressure-val').innerText = Math.round(speed * 200);
            } else {
                document.getElementById('flow-rate').innerText = "0";
                document.getElementById('pressure-val').innerText = "BLOCKED";
            }
        }

        function setupUI() {
            const initialVal = document.getElementById('fan-slider').value / 100;
            systemState.fanSpeed = initialVal;
            
            document.getElementById('fan-slider').addEventListener('input', (e) => {
                systemState.fanSpeed = e.target.value / 100;
                updateSystemUI();
            });
            updateSystemUI();
        }

        function createAnnotations() {
            const centerY = CONFIG.duct.height/9 + 0.5;
            const bendX = CONFIG.duct.bendRadius; 
            const bendY = centerY + CONFIG.duct.bendRadius;

            createLabelNode('INTAKE GATE', new THREE.Vector3(CONFIG.components.damperX, centerY, 0), 'Pressure Control');
            createLabelNode('AXIAL FAN', new THREE.Vector3(CONFIG.components.fanX, centerY, 0), 'Airflow Accelerator');
            createLabelNode('DYNAMIC BEND', new THREE.Vector3(bendX, bendY, 0), 'Flow Redirection');
        }

        function createLabelNode(title, pos, sub) {
            const container = document.createElement('div');
            container.className = 'label-container';
            container.innerHTML = `<div class="label-text"><div class="label-title">${title}</div><span class="label-sub">${sub}</span></div>`;
            document.getElementById('canvas-container').appendChild(container);
            annotationData.push({ dom: container, pos: pos, offset: new THREE.Vector3(1, 1, 0) });
        }

        function updateAnnotations() {
            const svg = document.getElementById('svg-lines');
            svg.innerHTML = '';
            annotationData.forEach(label => {
                const screenPos = label.pos.clone().project(camera);
                const targetPos = label.pos.clone().add(label.offset).project(camera);
                if (screenPos.z < 1) {
                    label.dom.style.opacity = 1;
                    label.dom.style.left = (targetPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                    label.dom.style.top = (targetPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
                    
                    const x1 = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y1 = (screenPos.y * -0.5 + 0.5) * window.innerHeight;
                    const x2 = (targetPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y2 = (targetPos.y * -0.5 + 0.5) * window.innerHeight;
                    
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('stroke', '#525252'); line.setAttribute('stroke-width', '1');
                    line.setAttribute('stroke-dasharray', '3');
                    svg.appendChild(line);
                } else { label.dom.style.opacity = 0; }
            });
        }

        function startSequence() {
            const obj = window.sceneObjects;
            if (!obj) return;
            gsap.set([obj.damper.scale, obj.fan.scale], { x:0, y:0, z:0 });
            const tl = gsap.timeline();
            tl.to(obj.damper.scale, { x:1, y:1, z:1, duration: 1, ease: "power3.out" });
            tl.to(obj.fan.scale, { x:1, y:1, z:1, duration: 1, ease: "power3.out" }, "-=0.5");
            tl.to('.label-container', { opacity: 1, stagger: 0.2, duration: 0.5 }, "-=0.2");
        }

        function animate() {
            requestAnimationFrame(animate);
            frameCount++;
            const delta = clock.getDelta();

            if (fanRotor) fanRotor.rotation.x += delta * 20 * systemState.fanSpeed;

            if (damperBlades) {
                const targetAngle = systemState.damperOpen ? Math.PI / 2 : 0;
                const b1 = damperBlades.children[0];
                b1.rotation.y += (targetAngle - b1.rotation.y) * 0.1;
                const b2 = damperBlades.children[1];
                b2.rotation.y += (-targetAngle - b2.rotation.y) * 0.1;
            }

            updateParticles();
            updateAnnotations();
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
